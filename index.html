<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>PUTSIE WORLD - Unbreakable</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #ff4757; --s: #2ed573; --b: #1e90ff; --grass: #7bed9f; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2f3542; font-family: 'Quicksand', sans-serif; }

        /* Login Scherm */
        #login { position: fixed; inset: 0; background: #1e90ff; z-index: 1000; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .login-card { background: white; padding: 40px; border-radius: 30px; text-align: center; width: 320px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        h1 { font-family: 'Fredoka One', cursive; color: #1e90ff; margin: 0 0 10px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #eee; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; text-align: center; }

        /* HUD & UI */
        #hud { position: fixed; top: 20px; left: 20px; z-index: 500; background: white; padding: 20px; border-radius: 20px; width: 240px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: none; }
        .btn { background: var(--s); color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 16px; border-bottom: 4px solid #26af5a; }
        .btn:active { border-bottom: 0; transform: translateY(4px); }
        .shop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .item { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; text-align: center; padding: 8px; font-size: 22px; transition: 0.1s; }
        .item:hover { transform: scale(1.1); background: white; }

        /* Wereld */
        #map { width: 8000px; height: 8000px; background: var(--grass); position: absolute; transition: transform 0.1s linear; }
        .player { width: 50px; height: 50px; position: absolute; border-radius: 50%; background: var(--p); border: 3px solid white; transform: translate(-50%, -50%); z-index: 100; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; }
        .player::after { content: attr(data-name); position: absolute; top: -30px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
        .local { background: var(--b) !important; box-shadow: 0 0 20px rgba(30,144,255,0.6); }
        .obj { position: absolute; font-size: 55px; transform: translate(-50%, -75%); z-index: 10; pointer-events: none; }
        
        #connection-info { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: white; opacity: 0.5; }
    </style>
</head>
<body>

<div id="login">
    <div class="login-card">
        <h1>PUTSIE WORLD</h1>
        <input type="text" id="nick" placeholder="Kies je naam..." maxlength="12">
        <button class="btn" onclick="startPutsie()">STARTEN 🚀</button>
        <p style="font-size: 11px; color: #777; margin-top: 10px;">Werkt de server niet? Dan speel je automatisch offline!</p>
    </div>
</div>

<div id="hud">
    <div style="font-size: 28px; font-weight: 900;">💰 €<span id="money-display">250</span></div>
    <button class="btn" onclick="earnMoney()">💼 WERKEN (+€50)</button>
    <div class="shop" id="shop-ui"></div>
    <div style="margin-top: 10px; font-size: 10px; text-align: center; color: #aaa;" id="status-text">Status: Offline</div>
</div>

<div id="map"></div>
<div id="connection-info">Putsie Engine v4.0 - Build 2026</div>

<script>
    // --- SETUP ---
    const URL = 'https://dvnbmzepheskjvhcydta.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bmJtemVwaGVza2p2aGN5ZHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjc1NjcsImV4cCI6MjA5MzkwMzU2N30.OW_8kqcRnDd_i2v1EcSn3IwoWKAsspyLQ3MUOIUD2mY';
    
    let supabaseClient = null;
    try { supabaseClient = supabase.createClient(URL, KEY); } catch(e) { console.log("Offline mode"); }

    let nickname = "Putsie";
    let money = 250;
    let px = 4000, py = 4000, vx = 0, vy = 0;
    const keys = {};
    const emojis = ['🏠', '🏢', '🏰', '🌳', '🌴', '🏪', '🚑', '🚨', '🏟️', '🎡', '🚗', '🐶', '🔥', '💎', '🍔', '🍕'];

    // --- GAME START ---
    function startPutsie() {
        nickname = document.getElementById('nick').value || "Speler";
        document.getElementById('login').style.opacity = "0";
        setTimeout(() => document.getElementById('login').style.display = "none", 500);
        document.getElementById('hud').style.display = "block";

        // Shop vullen
        const shop = document.getElementById('shop-ui');
        emojis.forEach(e => {
            let d = document.createElement('div');
            d.className = 'item'; d.innerText = e;
            d.onclick = () => placeObject(e);
            shop.appendChild(d);
        });

        connect();
        requestAnimationFrame(gameLoop);
    }

    // --- MULTIPLAYER ---
    let channel = null;
    function connect() {
        if(!supabaseClient) return;
        
        channel = supabaseClient.channel('putsies_world_main');
        
        channel.on('broadcast', { event: 'pos' }, (payload) => {
            updateOtherPlayer(payload.payload);
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'putsie_objects' }, (payload) => {
            renderBuilding(payload.new);
        })
        .subscribe((status) => {
            if(status === 'SUBSCRIBED') {
                document.getElementById('status-text').innerText = "Status: 🟢 ONLINE";
                loadBuildings();
            }
        });
    }

    async function loadBuildings() {
        const { data } = await supabaseClient.from('putsie_objects').select('*');
        if(data) data.forEach(renderBuilding);
    }

    function updateOtherPlayer(data) {
        let p = document.getElementById('p-' + data.id);
        if(!p) {
            p = document.createElement('div');
            p.id = 'p-' + data.id; p.className = 'player';
            p.setAttribute('data-name', data.id);
            document.getElementById('map').appendChild(p);
        }
        p.style.left = data.x + 'px'; p.style.top = data.y + 'px';
    }

    // --- ENGINE ---
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function gameLoop() {
        if(keys['KeyW'] || keys['ArrowUp']) vy -= 1.2;
        if(keys['KeyS'] || keys['ArrowDown']) vy += 1.2;
        if(keys['KeyA'] || keys['ArrowLeft']) vx -= 1.2;
        if(keys['KeyD'] || keys['ArrowRight']) vx += 1.2;

        vx *= 0.88; vy *= 0.88;
        px += vx; py += vy;

        // Boundaries
        px = Math.max(50, Math.min(7950, px));
        py = Math.max(50, Math.min(7950, py));

        // Update Self
        let me = document.getElementById('me');
        if(!me) {
            me = document.createElement('div');
            me.id = 'me'; me.className = 'player local';
            me.setAttribute('data-name', nickname);
            document.getElementById('map').appendChild(me);
        }
        me.style.left = px + 'px'; me.style.top = py + 'px';

        // Camera
        document.getElementById('map').style.transform = `translate(${window.innerWidth/2 - px}px, ${window.innerHeight/2 - py}px)`;

        // Sync
        if(channel && (Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1)) {
            channel.send({ type: 'broadcast', event: 'pos', payload: { id: nickname, x: px, y: py }});
        }

        requestAnimationFrame(gameLoop);
    }

    function earnMoney() {
        money += 50;
        document.getElementById('money-display').innerText = money;
    }

    async function placeObject(type) {
        if(money < 50) return;
        money -= 50;
        document.getElementById('money-display').innerText = money;

        const obj = { id: 'temp-' + Date.now(), type, x: px, y: py };
        renderBuilding(obj);

        if(supabaseClient) {
            await supabaseClient.from('putsie_objects').insert([{ type, x: px, y: py, owner: nickname }]);
        }
    }

    function renderBuilding(data) {
        if(document.getElementById(data.id)) return;
        const b = document.createElement('div');
        b.id = data.id; b.className = 'obj';
        b.innerText = data.type;
        b.style.left = data.x + 'px'; b.style.top = data.y + 'px';
        document.getElementById('map').appendChild(b);
    }
</script>
</body>
</html>
