<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUTSIE WORLD</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,html{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Nunito',sans-serif;user-select:none}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0f0c29,#302b63);z-index:999;display:flex;align-items:center;justify-content:center}
.card{background:#fff;padding:40px;border-radius:24px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-family:'Fredoka One',cursive;font-size:38px;background:linear-gradient(135deg,#1e90ff,#a55eea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.card p{color:#aaa;font-size:13px;margin-bottom:20px}
.avatars{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.av{width:46px;height:46px;border-radius:50%;border:3px solid #eee;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:.15s}
.av.on,.av:hover{border-color:#1e90ff;transform:scale(1.15)}
input#nm{width:100%;padding:13px;border-radius:12px;border:2px solid #eee;font-size:16px;font-family:'Nunito',sans-serif;font-weight:700;text-align:center;outline:none;margin-bottom:14px}
input#nm:focus{border-color:#1e90ff}
#btnStart{width:100%;padding:15px;background:linear-gradient(135deg,#1e90ff,#a55eea);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer}

/* HUD */
#hud{position:fixed;top:15px;left:15px;z-index:100;width:255px;display:none;gap:8px;flex-direction:column}
.panel{background:rgba(255,255,255,.95);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.money{font-size:26px;font-weight:900;color:#222}
.money span{color:#2ed573}
.xpbar{height:6px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}
.xpfill{height:100%;background:linear-gradient(90deg,#ffd32a,#ff6b35);border-radius:3px;transition:width .4s}
.btn{width:100%;padding:11px;border:none;border-radius:11px;font-size:14px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;margin-top:6px}
.btn-g{background:#2ed573;color:#fff;box-shadow:0 4px 0 #1fa84e}
.btn-g:active{transform:translateY(3px);box-shadow:none}
.btn-g:disabled{opacity:.4;cursor:not-allowed}
.btn-r{background:#ff4757;color:#fff;box-shadow:0 4px 0 #c0392b}
.btn-r:active{transform:translateY(3px);box-shadow:none}
.wbar{height:5px;background:#eee;border-radius:3px;margin-top:5px;overflow:hidden}
.wfill{height:100%;background:#2ed573;border-radius:3px;transition:width .1s linear}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{flex:1;padding:6px;border-radius:8px;border:2px solid #ddd;background:#fff;cursor:pointer;font-size:12px;font-weight:700;transition:.1s}
.tab.on{background:#1e90ff;color:#fff;border-color:#1e90ff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.si{background:#f8f9fa;border:2px solid #eee;border-radius:9px;cursor:pointer;text-align:center;padding:7px 3px;font-size:19px;transition:.15s}
.si:hover{transform:scale(1.1);border-color:#1e90ff}
.si span{font-size:9px;color:#999;display:block;font-weight:700}
.si.locked{opacity:.35;cursor:not-allowed}
.si.locked:hover{transform:none}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block}
.dot.on{background:#2ed573;box-shadow:0 0 5px #2ed573}

/* CHAT */
#chat{position:fixed;bottom:15px;left:15px;width:270px;z-index:100;display:none}
#cmsg{background:rgba(0,0,0,.7);border-radius:13px 13px 0 0;padding:8px;height:130px;overflow-y:auto}
#cmsg::-webkit-scrollbar{width:3px}
#cmsg::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.cm{font-size:12px;color:#fff;margin-bottom:3px;line-height:1.4}
.cm.sys{color:#ffd32a;font-style:italic}
.cm b{font-weight:900}
#crow{display:flex;gap:4px;background:rgba(0,0,0,.6);border-radius:0 0 13px 13px;padding:7px}
#ci{flex:1;padding:7px 10px;border-radius:9px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-family:'Nunito',sans-serif;outline:none}
#ci::placeholder{color:rgba(255,255,255,.4)}
#csend{padding:7px 12px;border-radius:9px;background:#1e90ff;color:#fff;border:none;cursor:pointer;font-size:15px}

/* MINIMAP */
#mini{position:fixed;bottom:15px;right:15px;width:150px;height:150px;background:rgba(0,0,0,.7);border-radius:14px;overflow:hidden;z-index:100;display:none;border:2px solid rgba(255,255,255,.1)}
#mini canvas{width:100%;height:100%}
#mini .ml{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;color:rgba(255,255,255,.4);letter-spacing:1px}

/* PLAYERS */
#plist{position:fixed;top:15px;right:15px;width:170px;z-index:100;display:none}
.pe{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:12px;font-weight:700}
.pe.me{color:#1e90ff}

/* NOTIF */
#notif{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.ni{background:rgba(0,0,0,.85);color:#fff;padding:9px 18px;border-radius:25px;font-size:13px;font-weight:800;backdrop-filter:blur(8px);animation:nianim 3s forwards}
@keyframes nianim{0%{opacity:0;transform:translateY(-15px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0}}

/* WORLD */
#world{width:100vw;height:100vh;overflow:hidden;position:relative}
#map{width:8000px;height:8000px;position:absolute;background:#4caf70;background-image:repeating-linear-gradient(45deg,transparent,transparent 80px,rgba(0,0,0,.02) 80px,rgba(0,0,0,.02) 81px)}
.road-h{position:absolute;height:55px;background:#777;left:0;right:0}
.road-v{position:absolute;width:55px;background:#777;top:0;bottom:0}
.lake{position:absolute;background:#4fc3f7;border-radius:50%}
.player{width:50px;height:50px;position:absolute;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);z-index:20;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.player::after{content:attr(data-name);position:absolute;top:-26px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap;font-family:'Nunito',sans-serif}
#me{box-shadow:0 0 0 4px rgba(30,144,255,.4),0 3px 10px rgba(0,0,0,.3)}
.obj{position:absolute;font-size:44px;transform:translate(-50%,-88%);z-index:10;cursor:pointer;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));transition:transform .15s}
.obj:hover{transform:translate(-50%,-100%) scale(1.15)}
.obj.new{animation:drop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{from{transform:translate(-50%,-180%) scale(.4);opacity:0}to{transform:translate(-50%,-88%);opacity:1}}
.bubble{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;padding:5px 9px;font-size:11px;font-weight:800;color:#333;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 8px rgba(0,0,0,.2);animation:bfade 4s forwards;font-family:'Nunito',sans-serif}
.bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#fff}
@keyframes bfade{0%,70%{opacity:1}100%{opacity:0}}

/* INTERIOR */
#interior{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center}
#interior.open{display:flex}
#ibg{position:absolute;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px)}
#iroom{position:relative;z-index:1;width:min(680px,95vw);height:min(480px,82vh);border-radius:22px;overflow:hidden;animation:ropen .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes ropen{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#iroom .rh{padding:16px 22px;display:flex;align-items:center;gap:10px;color:#fff}
#iroom .rt{font-size:20px;font-weight:900}
#iroom .ro{font-size:12px;opacity:.7;margin-left:auto}
.iexit{background:rgba(255,255,255,.2);border:none;border-radius:9px;color:#fff;padding:7px 14px;cursor:pointer;font-weight:800;font-size:13px;font-family:'Nunito',sans-serif}
.iexit:hover{background:rgba(255,255,255,.35)}
#iroom .rb{flex:1;padding:18px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow-y:auto}
.furn{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;cursor:pointer;transition:.15s;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.2)}
.furn:hover{transform:scale(1.08)}
.furn span{font-size:10px;margin-top:3px;font-weight:700;opacity:.8;color:#fff}
#iroom .rf{padding:10px 22px;font-size:11px;opacity:.5;border-top:1px solid rgba(255,255,255,.1);color:#fff}

/* DPAD */
#dpad{position:fixed;bottom:20px;right:20px;display:none;z-index:100}
.dp{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px}
.db{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.3);border-radius:10px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
.db:active{background:rgba(255,255,255,.4)}
.de{background:transparent;border:none;pointer-events:none}

@media(max-width:700px){#dpad{display:block}#plist{display:none!important}}
</style>
</head>

  // meren
  [{x:800,y:800,w:280,h:180},{x:5400,y:1900,w:360,h:260},{x:2100,y:5400,w:300,h:220},{x:6400,y:5900,w:450,h:300}].forEach(function(l){
    var w = document.createElement('div'); w.className='lake';
    w.style.cssText='left:'+l.x+'px;top:'+l.y+'px;width:'+l.w+'px;height:'+l.h+'px';
    map.appendChild(w);
  });
  // deco
  [{e:'🌳',x:300,y:300},{e:'🌳',x:450,y:280},{e:'🌴',x:7000,y:900},{e:'🌴',x:7150,y:1100},{e:'🗻',x:600,y:5800},{e:'🗻',x:780,y:5600}].forEach(function(d){
    placeObj({id:'deco_'+d.x+'_'+d.y,type:d.e,x:d.x,y:d.y,owner:''},false);
  });
}

// SHOP
function buildShop(tab){
  curTab = tab;
  var g = document.getElementById('shopgrid');
  g.innerHTML = '';
  SHOP[tab].forEach(function(item){
    var d = document.createElement('div');
    d.className = 'si' + (item.c > money ? ' locked' : '');
    d.innerHTML = item.e + '<span>€'+item.c+'</span>';
    d.onclick = function(){ doPlace(item); };
    g.appendChild(d);
  });
}
function refreshLocks(){
  var items = document.querySelectorAll('.si');
  var i=0;
  (SHOP[curTab]||[]).forEach(function(item){
    if(items[i]) items[i].className = 'si' + (item.c > money ? ' locked' : '');
    i++;
  });
}

// HUD
function updateHUD(){
  document.getElementById('mon').textContent = money;
  document.getElementById('scr').textContent = score;
  document.getElementById('lvl').textContent = lvl;
  var xpNeed = lvl * 200;
  document.getElementById('xpf').style.width = Math.min(100,(xp/xpNeed)*100) + '%';
  refreshLocks();
}
function addXP(n){
  xp += n;
  var need = lvl*200;
  if(xp >= need){ xp -= need; lvl++; notify('⭐ Level ' + lvl + '!'); }
  updateHUD();
}

// WORK
function doWork(){
  var now = Date.now();
  if(now - lastWork < 3000) return;
  lastWork = now;
  var earn = 50 + (lvl-1)*10;
  money += earn; score += earn;
  addXP(10);
  notify('💼 +€'+earn);
  updateHUD();
  var btn = document.getElementById('wbtn');
  btn.disabled = true;
  var fill = document.getElementById('wf');
  fill.style.width='100%';
  if(wTimer) clearInterval(wTimer);
  wTimer = setInterval(function(){
    var p = Math.max(0, 100 - ((Date.now()-lastWork)/3000)*100);
    fill.style.width = p+'%';
    if(p<=0){ clearInterval(wTimer); btn.disabled=false; fill.style.width='100%'; }
  },60);
  if(chan) chan.send({type:'broadcast',event:'action',payload:{id:uid,name:nick,action:'work'}});
}

// PLACE
function doPlace(item){
  if(money < item.c){ notify('❌ Te weinig geld'); return; }
  money -= item.c; score += Math.floor(item.c/2);
  addXP(Math.floor(item.c/10));
  updateHUD();
  var id = 'o'+Date.now()+Math.random().toString(36).slice(2,5);
  var ox = px + (Math.random()-.5)*60;
  var oy = py + 30;
  var obj = {id:id,type:item.e,x:Math.round(ox),y:Math.round(oy),owner:nick};
  placeObj(obj, true);
  myObjs.push(id);
  // broadcast naar anderen
  if(chan) chan.send({type:'broadcast',event:'newobj',payload:obj});
  // opslaan in db
  if(sb) sb.from('putsie_objects').insert([{id:id,type:item.e,x:Math.round(ox),y:Math.round(oy),owner:nick}]).then(function(){}).catch(function(){});
}

function placeObj(data, isNew){
  if(allObjs[data.id]) return;
  allObjs[data.id] = true;
  var el = document.createElement('div');
  el.id = 'O'+data.id;
  el.className = 'obj' + (isNew ? ' new' : '');
  el.textContent = data.type;
  el.style.left = data.x+'px';
  el.style.top = data.y+'px';
  el.setAttribute('data-owner', data.owner||'');
  el.onclick = function(){ tryEnter(data); };
  document.getElementById('map').appendChild(el);
}

function doClear(){
  if(!myObjs.length){ notify('Niks om te verwijderen'); return; }
  var ids = myObjs.slice();
  myObjs = [];
  ids.forEach(function(id){
    var el = document.getElementById('O'+id);
    if(el) el.remove();
    delete allObjs[id];
  });
  if(chan) chan.send({type:'broadcast',event:'delobj',payload:{ids:ids}});
  if(sb) sb.from('putsie_objects').delete().in('id',ids).then(function(){}).catch(function(){});
  notify('💣 Verwijderd!');
}

// INTERIOR
function tryEnter(data){
  var cfg = INTERIOR[data.type];
  if(!cfg) return;
  inBuilding = true;
  document.getElementById('iico').textContent = data.type;
  document.getElementById('itit').textContent = cfg.n;
  document.getElementById('iown').textContent = data.owner ? '🏗️ '+data.owner : '';
  var rh = document.getElementById('irh');
  rh.style.background = cfg.bg;
  document.getElementById('iroom').style.background = cfg.fl;
  var rb = document.getElementById('irb');
  rb.innerHTML = '';
  cfg.fur.forEach(function(f){
    var el = document.createElement('div');
    el.className = 'furn';
    el.style.background = cfg.bg+'33';
    el.style.borderColor = cfg.bg+'55';
    el.innerHTML = f.e + '<span>'+f.n+'</span>';
    el.onclick = function(){
      notify(f.e+' '+f.n);
      if(Math.random()<.15){ var g=10+Math.floor(Math.random()*30); money+=g; updateHUD(); notify('💰 Gevonden: €'+g+'!'); }
    };
    rb.appendChild(el);
  });
  document.getElementById('interior').classList.add('open');
  notify(data.type+' Binnen: '+cfg.n);
}
function closeInterior(){
  document.getElementById('interior').classList.remove('open');
  inBuilding = false;
}

// SUPABASE
function initSB(){
  try {
    var lib = (typeof supabase !== 'undefined') ? supabase : window.supabase;
    if(!lib || !lib.createClient){ setStatus(false); return; }
    sb = lib.createClient(SB_URL, SB_KEY);
    chan = sb.channel('putsie_v5',{config:{broadcast:{self:false}}});
    chan
      .on('broadcast',{event:'pos'},function(msg){ onPos(msg.payload); })
      .on('broadcast',{event:'chat'},function(msg){ onChat(msg.payload); })
      .on('broadcast',{event:'newobj'},function(msg){ placeObj(msg.payload,false); })
      .on('broadcast',{event:'delobj'},function(msg){
        (msg.payload.ids||[]).forEach(function(id){
          var el=document.getElementById('O'+id); if(el) el.remove(); delete allObjs[id];
        });
      })
      .on('broadcast',{event:'action'},function(msg){
        if(msg.payload.action==='work') addMsg({sys:true,txt:msg.payload.name+' werkt! 💼'});
      })
      .subscribe(function(s){
        if(s==='SUBSCRIBED'){
          setStatus(true);
          loadObjs();
          chan.send({type:'broadcast',event:'chat',payload:{id:uid,name:'🌍',txt:nick+' is erbij!',sys:true}});
        } else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){
          setStatus(false);
        }
      });
  } catch(e){
    setStatus(false);
  }
}

function loadObjs(){
  if(!sb) return;
  sb.from('putsie_objects').select('*').limit(500).then(function(res){
    if(res.data) res.data.forEach(function(r){ placeObj(r,false); });
  }).catch(function(){});
}

function setStatus(on){
  document.getElementById('stdot').className = 'dot'+(on?' on':'');
  document.getElementById('sttxt').textContent = on ? 'Online ✓' : 'Offline';
}

// PLAYERS
function onPos(d){
  if(d.id===uid) return;
  var p = others[d.id];
  if(!p){
    var el = document.createElement('div');
    el.className = 'player';
    el.style.background = hslColor(d.id);
    el.setAttribute('data-name', d.name);
    el.textContent = d.emo||'😎';
    document.getElementById('map').appendChild(el);
    p = {el:el,name:d.name,emo:d.emo||'😎',t:Date.now()};
    others[d.id] = p;
    addMsg({sys:true,txt:d.name+' is erbij!'});
  }
  p.t = Date.now();
  p.name = d.name;
  p.el.style.left = d.x+'px';
  p.el.style.top = d.y+'px';
  p.el.setAttribute('data-name', d.name);
  document.getElementById('pcnt').textContent = Object.keys(others).length+1;
}

function cleanOthers(){
  var now = Date.now();
  Object.keys(others).forEach(function(id){
    if(now - others[id].t > 12000){
      others[id].el.remove();
      delete others[id];
      document.getElementById('pcnt').textContent = Object.keys(others).length+1;
    }
  });
}

function updatePlist(){
  var el = document.getElementById('pl');
  el.innerHTML = '<div class="pe me"><span>'+emo+'</span><span>'+nick+' (jij)</span></div>';
  Object.values(others).forEach(function(p){
    el.innerHTML += '<div class="pe"><span>'+(p.emo||'😎')+'</span><span>'+p.name+'</span></div>';
  });
}

function hslColor(s){
  var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))&0xffffff;
  return 'hsl('+(Math.abs(h)%360)+',70%,55%)';
}

// CHAT
function onChat(d){
  if(d.id===uid) return;
  addMsg(d);
  var p = others[d.id];
  if(p) showBubble(p.el, d.txt);
}
function sendChat(){
  var ci = document.getElementById('ci');
  var txt = ci.value.trim();
  if(!txt) return;
  ci.value='';
  addMsg({name:nick,txt:txt,sys:false});
  showBubble(document.getElementById('me'), txt);
  if(chan) chan.send({type:'broadcast',event:'chat',payload:{id:uid,name:nick,emo:emo,txt:txt,sys:false}});
}
function addMsg(d){
  var box = document.getElementById('cmsg');
  var el = document.createElement('div');
  el.className = 'cm'+(d.sys?' sys':'');
  if(d.sys) el.textContent = d.txt;
  else el.innerHTML = '<b>'+esc(d.name||'?')+':</b> '+esc(d.txt||'');
  box.appendChild(el);
  while(box.children.length>50) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function showBubble(el, txt){
  if(!el) return;
  var old = el.querySelector('.bubble'); if(old) old.remove();
  var b = document.createElement('div');
  b.className='bubble';
  b.textContent = txt.length>30 ? txt.slice(0,30)+'...' : txt;
  el.appendChild(b);
  setTimeout(function(){ b.remove(); },4000);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// MINIMAP
function drawMini(){
  var c = document.getElementById('mc');
  if(!c) return;
  var ctx = c.getContext('2d');
  var W=150, sc=W/8000;
  ctx.clearRect(0,0,W,W);
  ctx.fillStyle='#4caf70'; ctx.fillRect(0,0,W,W);
  ctx.fillStyle='#777';
  [1500,3000,4500,6000].forEach(function(y){ ctx.fillRect(0,y*sc,W,55*sc); ctx.fillRect(y*sc,0,55*sc,W); });
  ctx.fillStyle='rgba(255,255,255,.4)';
  Object.keys(allObjs).forEach(function(id){
    var el=document.getElementById('O'+id); if(!el) return;
    ctx.fillRect(parseFloat(el.style.left)*sc-1,parseFloat(el.style.top)*sc-1,3,3);
  });
  Object.values(others).forEach(function(p){
    ctx.fillStyle='#ff4757';
    ctx.beginPath(); ctx.arc(parseFloat(p.el.style.left)*sc,parseFloat(p.el.style.top)*sc,3,0,6.28); ctx.fill();
  });
  ctx.fillStyle='#1e90ff';
  ctx.beginPath(); ctx.arc(px*sc,py*sc,4,0,6.28); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
}

// NOTIFY
function notify(msg){
  var box = document.getElementById('notif');
  var el = document.createElement('div');
  el.className='ni'; el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){ el.remove(); },3200);
}

// GAME LOOP
var lastT = 0, lastSync = 0;
function startLoop(){
  function loop(t){
    var dt = Math.min((t-lastT)/16.67,3); lastT=t;
    var u=keys.w||keys.ArrowUp||mkeys.u;
    var d=keys.s||keys.ArrowDown||mkeys.d;
    var l=keys.a||keys.ArrowLeft||mkeys.l;
    var r=keys.d||keys.ArrowRight||mkeys.r;
    var sp=1.5*dt;
    if(u) vy-=sp; if(d) vy+=sp; if(l) vx-=sp; if(r) vx+=sp;
    if((u||d)&&(l||r)){ vx*=.707; vy*=.707; }
    var spd=Math.sqrt(vx*vx+vy*vy);
    if(spd>18){ vx=vx/spd*18; vy=vy/spd*18; }
    vx*=Math.pow(.85,dt); vy*=Math.pow(.85,dt);
    px+=vx; py+=vy;
    px=Math.max(50,Math.min(7950,px));
    py=Math.max(50,Math.min(7950,py));
    var me = document.getElementById('me');
    if(!me){
      me=document.createElement('div');
      me.id='me'; me.className='player';
      me.style.background='#1e90ff';
      me.setAttribute('data-name',nick);
      me.textContent=emo;
      document.getElementById('map').appendChild(me);
    }
    me.style.left=Math.round(px)+'px';
    me.style.top=Math.round(py)+'px';
    document.getElementById('map').style.transform='translate('+Math.round(window.innerWidth/2-px)+'px,'+Math.round(window.innerHeight/2-py)+'px)';
    if(chan && t-lastSync>80){
      lastSync=t;
      chan.send({type:'broadcast',event:'pos',payload:{id:uid,name:nick,emo:emo,x:Math.round(px),y:Math.round(py)}});
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

// EVENTS
document.addEventListener('DOMContentLoaded', function(){
  // Login knop
  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('nm').addEventListener('keydown', function(e){ if(e.key==='Enter') startGame(); });

  // Avatar picker
  document.getElementById('avpick').addEventListener('click', function(e){
    var t = e.target.closest('.av'); if(!t) return;
    document.querySelectorAll('.av').forEach(function(a){ a.classList.remove('on'); });
    t.classList.add('on');
    emo = t.getAttribute('data-e');
  });

  // Shop tabs
  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab'); if(!t) return;
    document.querySelectorAll('.tab').forEach(function(a){ a.classList.remove('on'); });
    t.classList.add('on');
    buildShop(t.getAttribute('data-t'));
  });

  // Work & clear
  document.getElementById('wbtn').addEventListener('click', doWork);
  document.getElementById('clrbtn').addEventListener('click', doClear);

  // Chat
  document.getElementById('csend').addEventListener('click', sendChat);
  document.getElementById('ci').addEventListener('keydown', function(e){
    e.stopPropagation();
    if(e.key==='Enter') sendChat();
  });

  // Interior close
  document.getElementById('ibg').addEventListener('click', closeInterior);
  document.getElementById('iex').addEventListener('click', closeInterior);

  // Keyboard
  window.addEventListener('keydown', function(e){
    var ci = document.getElementById('ci');
    if(document.activeElement===ci) return;
    if(e.key==='Escape'){ closeInterior(); return; }
    keys[e.key]=true; keys[e.code]=true;
    if(e.key==='e'||e.key==='E') doWork();
  });
  window.addEventListener('keyup', function(e){ keys[e.key]=false; keys[e.code]=false; });

  // D-pad
  var dmap = {du:'u',dd:'d',dl:'l',dr:'r'};
  Object.keys(dmap).forEach(function(id){
    var dir = dmap[id];
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart',function(e){e.preventDefault();mkeys[dir]=true;});
    el.addEventListener('touchend',function(e){e.preventDefault();mkeys[dir]=false;});
    el.addEventListener('mousedown',function(){mkeys[dir]=true;});
    el.addEventListener('mouseup',function(){mkeys[dir]=false;});
  });

  // Rechtermuisknop blokkeren
  var map = document.getElementById('map');
  if(map) map.addEventListener('contextmenu',function(e){e.preventDefault();});
});
</script>
