<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer City Builder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #3498db; --s: #2ecc71; --g: #78e08f; --dark: #2c3e50; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Inter', sans-serif; }
        
        /* Login Scherm */
        #login-overlay { position: fixed; inset: 0; background: var(--dark); z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; }
        .login-box { background: white; padding: 40px; border-radius: 20px; color: var(--dark); text-align: center; width: 300px; }
        
        /* Wereld */
        #map { width: 5000px; height: 5000px; background: var(--g); position: absolute; top: 0; left: 0; 
               background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 100px),
                                 repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 100px); }
        
        /* Objecten & Spelers */
        .player { width: 45px; height: 45px; position: absolute; border-radius: 50%; background: #e74c3c; z-index: 100; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: bold; transform: translate(-50%, -50%); border: 3px solid rgba(0,0,0,0.2); }
        .local { background: var(--p) !important; border-color: white !important; }
        .building { position: absolute; font-size: 60px; transform: translate(-50%, -50%); z-index: 10; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }
        
        /* UI */
        #hud { position: fixed; top: 20px; left: 20px; z-index: 500; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 250px; }
        .btn { background: var(--s); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .shop-item { font-size: 12px; padding: 8px; background: #f1f2f6; border-radius: 5px; border: none; cursor: pointer; }
        .shop-item:hover { background: #dfe4ea; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>Stad Simulator</h2>
        <input type="text" id="username" placeholder="Gebruikersnaam" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px;">
        <button class="btn" onclick="startGame()">Start Spel</button>
    </div>
</div>

<div id="hud" style="display:none;">
    <div style="font-size: 24px; font-weight: 900; margin-bottom: 10px;">💰 €<span id="money">200</span></div>
    <button class="btn" onclick="work()">💼 Werken (+€50)</button>
    <p style="font-size: 12px; font-weight: bold; margin: 15px 0 5px;">Bouw Stad:</p>
    <div class="shop-grid">
        <button class="shop-item" onclick="build('🏠', 100)">Huis (€100)</button>
        <button class="shop-item" onclick="build('🏢', 500)">Flat (€500)</button>
        <button class="shop-item" onclick="build('🌳', 20)">Boom (€20)</button>
        <button class="shop-item" onclick="build('🛒', 300)">Winkel (€300)</button>
        <button class="shop-item" onclick="build('🏥', 1000)">Ziekenhuis (€1k)</button>
        <button class="shop-item" onclick="build('🚔', 400)">Politie (€400)</button>
    </div>
    <div id="status" style="font-size: 10px; margin-top: 10px; color: green;">Verbonden als: <span id="display-name"></span></div>
</div>

<div id="map"></div>

<script>
    const URL = 'https://dvnbmzepheskjvhcydta.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bmJtemVwaGVza2p2aGN5ZHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjc1NjcsImV4cCI6MjA5MzkwMzU2N30.OW_8kqcRnDd_i2v1EcSn3IwoWKAsspyLQ3MUOIUD2mY';
    const supabase = supabase.createClient(URL, KEY);

    let user = "";
    let money = 200;
    let pX = 2500, pY = 2500, vX = 0, vY = 0;
    const keys = {};

    async function startGame() {
        user = document.getElementById('username').value;
        if (user.length < 2) return alert("Kies een naam");
        
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('display-name').innerText = user;

        // Laad bestaande stad uit database
        const { data } = await supabase.from('city_objects').select('*');
        data.forEach(obj => renderBuilding(obj));

        initMultiplayer();
        requestAnimationFrame(loop);
    }

    function initMultiplayer() {
        const channel = supabase.channel('city_hall')
        .on('broadcast', { event: 'move' }, (p) => {
            let el = document.getElementById(p.payload.id);
            if (!el) {
                el = document.createElement('div');
                el.id = p.payload.id; el.className = 'player';
                document.getElementById('map').appendChild(el);
            }
            el.innerText = p.payload.user;
            el.style.left = p.payload.x + 'px'; el.style.top = p.payload.y + 'px';
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'city_objects' }, (p) => {
            renderBuilding(p.new);
        })
        .subscribe();

        window.multiplayer = channel;
    }

    function loop() {
        if (keys['KeyW'] || keys['ArrowUp']) vY -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) vY += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) vX -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) vX += 1;

        vX *= 0.85; vY *= 0.85;
        pX += vX; pY += vY;

        const me = getLocalPlayer();
        me.style.left = pX + 'px'; me.style.top = pY + 'px';
        
        // Camera
        document.getElementById('map').style.transform = `translate(${window.innerWidth/2 - pX}px, ${window.innerHeight/2 - pY}px)`;

        if (window.multiplayer) {
            window.multiplayer.send({ type: 'broadcast', event: 'move', payload: { id: user, user, x: pX, y: pY }});
        }
        requestAnimationFrame(loop);
    }

    async function build(type, cost) {
        if (money < cost) return alert("Niet genoeg geld!");
        money -= cost;
        document.getElementById('money').innerText = money;

        // Sla op in database zodat iedereen het ziet, ook na refresh!
        await supabase.from('city_objects').insert([{ type, x: pX, y: pY, owner: user }]);
    }

    function renderBuilding(obj) {
        if (document.getElementById(obj.id)) return;
        const b = document.createElement('div');
        b.id = obj.id; b.className = 'building';
        b.innerText = obj.type;
        b.style.left = obj.x + 'px'; b.style.top = obj.y + 'px';
        document.getElementById('map').appendChild(b);
    }

    function getLocalPlayer() {
        let me = document.getElementById('local');
        if (!me) {
            me = document.createElement('div');
            me.id = 'local'; me.className = 'player local';
            document.getElementById('map').appendChild(me);
        }
        return me;
    }

    function work() { money += 50; document.getElementById('money').innerText = money; }
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;
</script>
</body>
</html>
