<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Life Sim Pro - LIVE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #3498db; --s: #2ecc71; --g: #27ae60; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        #map { 
            width: 3000px; height: 3000px; background-color: var(--g);
            background-image: linear-gradient(rgba(255,255,255,0.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.05) 2px, transparent 2px);
            background-size: 80px 80px; position: absolute; top: 0; left: 0;
        }
        .player { 
            width: 50px; height: 50px; position: absolute; border-radius: 12px; background: #e74c3c;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.1s linear;
        }
        .local-player { background: var(--p); border: 3px solid white; z-index: 10; }
        #ui { 
            position: fixed; top: 20px; left: 20px; z-index: 100; background: white; 
            padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        button { background: var(--s); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        #status { font-size: 11px; margin-top: 5px; color: #7f8c8d; }
    </style>
</head>
<body>

<div id="ui">
    <div style="font-size: 24px; font-weight: bold;">💰 €<span id="money">0</span></div>
    <button onclick="work()">WERKEN</button>
    <div id="status">Verbinden...</div>
</div>

<div id="viewport">
    <div id="map"></div>
</div>

<script>
    // AUTOMATISCHE CONFIGURATIE
    const URL = 'https://dvnbmzepheskjvhcydta.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bmJtemVwaGVza2p2aGN5ZHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjc1NjcsImV4cCI6MjA5MzkwMzU2N30.OW_8kqcRnDd_i2v1EcSn3IwoWKAsspyLQ3MUOIUD2mY';
    
    const supabase = supabase.createClient(URL, KEY);
    const channel = supabase.channel('room_1', { config: { broadcast: { self: false } } });

    const map = document.getElementById('map');
    let myId = "ID_" + Math.floor(Math.random() * 9999);
    let money = 0;
    let x = 1500, y = 1500, vx = 0, vy = 0;
    const keys = {};

    // Multiplayer Verbinding
    channel.on('broadcast', { event: 'move' }, (payload) => {
        const d = payload.payload;
        let p = document.getElementById(d.id);
        if (!p) {
            p = document.createElement('div');
            p.id = d.id; p.className = 'player'; p.innerText = "VRIEND";
            map.appendChild(p);
        }
        p.style.transform = `translate(${d.x}px, ${d.y}px)`;
    }).subscribe((s) => {
        if (s === 'SUBSCRIBED') document.getElementById('status').innerText = "🟢 Online met vrienden";
    });

    // Besturing
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;

    function loop() {
        if (keys['KeyW'] || keys['ArrowUp']) vy -= 0.7;
        if (keys['KeyS'] || keys['ArrowDown']) vy += 0.7;
        if (keys['KeyA'] || keys['ArrowLeft']) vx -= 0.7;
        if (keys['KeyD'] || keys['ArrowRight']) vx += 0.7;

        vx *= 0.9; vy *= 0.9;
        x += vx; y += vy;

        // Grens check
        x = Math.max(0, Math.min(2950, x));
        y = Math.max(0, Math.min(2950, y));

        let me = document.getElementById(myId);
        if (!me) {
            me = document.createElement('div');
            me.id = myId; me.className = 'player local-player'; me.innerText = "JIJ";
            map.appendChild(me);
        }

        me.style.transform = `translate(${x}px, ${y}px)`;
        map.style.left = (window.innerWidth/2 - x - 25) + 'px';
        map.style.top = (window.innerHeight/2 - y - 25) + 'px';

        if (Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1) {
            channel.send({ type: 'broadcast', event: 'move', payload: { id: myId, x, y } });
        }
        requestAnimationFrame(loop);
    }

    function work() {
        money += 10;
        document.getElementById('money').innerText = money;
    }

    loop();
</script>
</body>
</html>
