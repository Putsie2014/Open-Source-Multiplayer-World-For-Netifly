<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>PUTSIE WORLD - Fixed & Fast</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #ff4757; --s: #2ed573; --b: #1e90ff; --grass: #7bed9f; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2f3542; font-family: 'Quicksand', sans-serif; }

        /* Login Scherm */
        #login { position: fixed; inset: 0; background: #1e90ff; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 30px; text-align: center; width: 320px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        h1 { font-family: 'Fredoka One', cursive; color: #1e90ff; margin: 0 0 10px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #eee; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; }

        /* Map & Spelers */
        #map { width: 8000px; height: 8000px; background: var(--grass); position: absolute; transition: 0.1s linear; }
        .player { width: 50px; height: 50px; position: absolute; border-radius: 50%; background: var(--p); border: 3px solid white; transform: translate(-50%, -50%); z-index: 100; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; }
        .player::before { content: attr(data-name); position: absolute; top: -25px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 5px; font-size: 10px; }
        .local { background: var(--b) !important; }
        .obj { position: absolute; font-size: 50px; transform: translate(-50%, -70%); z-index: 10; }

        /* HUD */
        #hud { position: fixed; top: 20px; left: 20px; z-index: 500; background: white; padding: 20px; border-radius: 20px; width: 220px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn { background: var(--s); color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .shop { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
        .item { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; text-align: center; padding: 5px; font-size: 20px; }
    </style>
</head>
<body>

<div id="login">
    <div class="login-card">
        <h1>PUTSIE WORLD</h1>
        <p id="msg">Voer je naam in om te starten</p>
        <input type="text" id="nick" placeholder="Jouw Naam...">
        <button class="btn" onclick="tryLogin()">START SPEL 🚀</button>
    </div>
</div>

<div id="hud" style="display:none">
    <div style="font-size: 24px; font-weight: 900;">💰 €<span id="money-val">?</span></div>
    <button class="btn" onclick="work()">WERKEN (+€50)</button>
    <div class="shop" id="shop"></div>
    <div id="debug" style="font-size: 9px; color: gray; margin-top: 10px;">Verbonden...</div>
</div>

<div id="map"></div>

<script>
    // CONFIG
    const URL = 'https://dvnbmzepheskjvhcydta.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bmJtemVwaGVza2p2aGN5ZHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjc1NjcsImV4cCI6MjA5MzkwMzU2N30.OW_8kqcRnDd_i2v1EcSn3IwoWKAsspyLQ3MUOIUD2mY';
    const supabaseClient = supabase.createClient(URL, KEY);

    let nickname = "";
    let money = 250;
    let x = 4000, y = 4000, vx = 0, vy = 0;
    const keys = {};
    const shopItems = ['🏠', '🏡', '🏢', '🏰', '🌳', '🏪', '🚑', '🚨', '⛲', '🏟️', '🎡', '🚗'];

    // --- LOGIN LOGICA ---
    async function tryLogin() {
        const input = document.getElementById('nick').value;
        if(input.length < 2) return alert("Naam te kort!");
        
        nickname = input;
        document.getElementById('msg').innerText = "Laden...";

        try {
            // Check of gebruiker al bestaat, zo niet: maak aan (Upsert)
            const { data, error } = await supabaseClient
                .from('putsie_users')
                .upsert({ id: nickname }, { onConflict: 'id' })
                .select();

            if (error) throw error;
            
            money = data[0].money || 250;
            document.getElementById('money-val').innerText = money;
            
            // Start het spel
            document.getElementById('login').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            initGame();
        } catch (err) {
            console.error(err);
            alert("Database fout! Check of je de SQL code hebt uitgevoerd.");
            // Forceer start voor testen
            document.getElementById('login').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            initGame();
        }
    }

    function initGame() {
        // Shop vullen
        const s = document.getElementById('shop');
        shopItems.forEach(i => {
            let d = document.createElement('div');
            d.className = 'item'; d.innerText = i;
            d.onclick = () => build(i);
            s.appendChild(d);
        });

        // Multiplayer kanalen
        const chan = supabaseClient.channel('world')
        .on('broadcast', { event: 'pos' }, (p) => {
            let other = document.getElementById(p.payload.id);
            if(!other) {
                other = document.createElement('div');
                other.id = p.payload.id; other.className = 'player';
                other.setAttribute('data-name', p.payload.id);
                document.getElementById('map').appendChild(other);
            }
            other.style.left = p.payload.x + 'px'; other.style.top = p.payload.y + 'px';
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'putsie_objects' }, (p) => {
            renderObj(p.new);
        })
        .subscribe();

        window.gameChan = chan;
        loadObjects();
        requestAnimationFrame(loop);
    }

    async function loadObjects() {
        const { data } = await supabaseClient.from('putsie_objects').select('*');
        if(data) data.forEach(renderObj);
    }

    function loop() {
        if(keys['KeyW'] || keys['ArrowUp']) vy -= 1;
        if(keys['KeyS'] || keys['ArrowDown']) vy += 1;
        if(keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
        if(keys['KeyD'] || keys['ArrowRight']) vx += 1;

        vx *= 0.9; vy *= 0.9;
        x += vx; y += vy;

        let me = document.getElementById('me');
        if(!me) {
            me = document.createElement('div');
            me.id = 'me'; me.className = 'player local';
            me.setAttribute('data-name', nickname);
            document.getElementById('map').appendChild(me);
        }
        me.style.left = x + 'px'; me.style.top = y + 'px';
        
        // Camera centreren
        document.getElementById('map').style.left = (window.innerWidth/2 - x) + 'px';
        document.getElementById('map').style.top = (window.innerHeight/2 - y) + 'px';

        if(window.gameChan) {
            window.gameChan.send({ type: 'broadcast', event: 'pos', payload: { id: nickname, x, y }});
        }
        requestAnimationFrame(loop);
    }

    async function build(type) {
        if(money < 50) return alert("Te weinig geld!");
        money -= 50;
        document.getElementById('money-val').innerText = money;
        await supabaseClient.from('putsie_objects').insert([{ type, x, y, owner: nickname }]);
    }

    function renderObj(obj) {
        if(document.getElementById(obj.id)) return;
        const d = document.createElement('div');
        d.id = obj.id; d.className = 'obj';
        d.innerText = obj.type;
        d.style.left = obj.x + 'px'; d.style.top = obj.y + 'px';
        document.getElementById('map').appendChild(d);
    }

    function work() { money += 50; document.getElementById('money-val').innerText = money; }
    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;
</script>
</body>
</html>
